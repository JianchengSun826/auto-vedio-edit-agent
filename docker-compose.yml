services:
  valkey:
    image: valkey/valkey:7
    volumes:
      - valkey_data:/data
    command: valkey-server --appendonly yes
    restart: unless-stopped

  worker:
    build: .
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      - valkey
    env_file:
      - api_keys.env
      - docker.env
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./tmp:/app/tmp
      - hf_models:/root/.cache/huggingface
      - whisperx_models:/root/.cache/whisperx
    restart: unless-stopped

  ui:
    build: .
    command: python app/main.py
    ports:
      - "7860:7860"
    depends_on:
      - valkey
    env_file:
      - api_keys.env
      - docker.env
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./tmp:/app/tmp
      - hf_models:/root/.cache/huggingface
      - whisperx_models:/root/.cache/whisperx
    restart: unless-stopped

volumes:
  valkey_data:
  hf_models:
  whisperx_models:
